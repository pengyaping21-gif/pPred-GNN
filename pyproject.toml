[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppred-release"
version = "0.2.0"
description = "Reproducible pPred single-peptide RT, MS2 and crosslinked-peptide RT finetuning"
requires-python = ">=3.8,<3.13"
dependencies = [
  "torch==2.4.0", "torch-geometric==2.6.1", "numpy==1.24.4",
  "rdkit==2024.3.5", "ogb==1.3.6", "transformers==4.40.2",
]

[project.scripts]
ppred = "ppred.cli:main"

[tool.setuptools.packages.find]
include = ["ppred*"]

[tool.setuptools.package-data]
ppred = ["resources/*.ini"]
